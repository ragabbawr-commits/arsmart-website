  $("catnav").innerHTML=[["#home","الرئيسية"],...CATS.map(c=>["#c-"+c.id,c.short])].map(([u,t])=>`<a href="${u}"${(h===u||(u==="#home"&&!location.hash))?' aria-current="page"':""}>${t}</a>`).join("");
  const cur=$("catnav").querySelector("[aria-current]");cur&&cur.scrollIntoView({block:"nearest",inline:"center"});
  setMenu(false);
  if(h==="#categories"){const el=$("categories");el&&el.scrollIntoView()} else window.scrollTo(0,0);
  bindBook();
}
const baseTitle=document.title;
function setMenu(o){$("menu").hidden=!o;$("scrim").hidden=!o;$("menuBtn").setAttribute("aria-expanded",String(o))}
$("menuBtn").onclick=()=>setMenu(true);$("menuClose").onclick=()=>setMenu(false);$("scrim").onclick=()=>setMenu(false);
$("menu").addEventListener("click",e=>{if(e.target.closest("a"))setMenu(false)});

const count=()=>Object.values(cart).reduce((a,b)=>a+b,0);
function cartMsg(){
  const lines=Object.keys(cart).map(id=>{const p=PRODUCTS.find(x=>x.id===id);return p?`- ${p.n} (${p.b} ${p.m}) × ${cart[id]}${p.p?` — ${fmt(p.p*cart[id])} ج.م`:""}`:""}).filter(Boolean);
  const name=$("cName").value.trim();
  return ["السلام عليكم، عايز أطلب من موقع AR&SMART:",...lines,"",`المنطقة: ${$("cArea").value}`,`النوع: ${$("cInst").value}`].concat(name?[`الاسم: ${name}`]:[]).join("\n");
}
function renderCart(){
  const n=count(); $("cartCount").hidden=!n; $("cartCount").textContent=n;
  const ids=Object.keys(cart);
  $("lines").innerHTML=ids.map(id=>{const p=PRODUCTS.find(x=>x.id===id);return `<div class="ci">${p.img?`<img src="${esc(p.img)}" alt="">`:`<span class="noimg"></span>`}<div><b>${esc(p.n)}</b><small>${esc(p.m)}${p.p?" · "+fmt(p.p)+" ج.م":""}</small></div>
    <div class="qty"><button type="button" data-dec="${id}" aria-label="تقليل">−</button><output>${cart[id]}</output><button type="button" data-inc="${id}" aria-label="زيادة">+</button></div></div>`}).join("")||'<p style="color:var(--muted)">السلة فاضية. دوس + على أي منتج عشان تضيفه.</p>';
  const tot=ids.reduce((s,id)=>{const p=PRODUCTS.find(x=>x.id===id);return s+(p.p||0)*cart[id]},0);
  $("totalRow").hidden=!tot; $("totalVal").textContent=fmt(tot)+" ج.م";
  $("sendWa").href=wa(cartMsg()); $("sendWa").hidden=!n; $("clearCart").hidden=!n;
}
function refreshCards(){document.querySelectorAll("[data-add]").forEach(b=>{const q=cart[b.dataset.add]||0;b.classList.toggle("in",!!q);b.innerHTML=ico(q?"check":"plus",2);b.setAttribute("aria-label",q?"في السلة: "+q:"أضف للسلة")})}
const sync=()=>{save();renderCart();refreshCards()};

document.addEventListener("click",e=>{
  const t=e.target.closest("button"); if(!t)return;
  if(t.dataset.f){filt=t.dataset.f;const h=location.hash;const c=CATS.find(x=>"#c-"+x.id===h);if(c){$("view").innerHTML=viewCat(c)}return}
  if(t.dataset.add){cart[t.dataset.add]=(cart[t.dataset.add]||0)+1;sync();return}
  if(t.dataset.inc){cart[t.dataset.inc]++;sync();return}
  if(t.dataset.dec){if(--cart[t.dataset.dec]<=0)delete cart[t.dataset.dec];sync();return}
  if(t.id==="cartBtn"){renderCart();$("drawer").hidden=false;$("closeCart").focus();return}
  if(t.id==="closeCart"){$("drawer").hidden=true;return}
  if(t.id==="clearCart"){cart={};sync();return}
});
$("drawer").addEventListener("click",e=>{if(e.target.id==="drawer")$("drawer").hidden=true});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){$("drawer").hidden=true;setMenu(false)}});
["cName","cArea","cInst"].forEach(id=>$(id).addEventListener("input",()=>{$("sendWa").href=wa(cartMsg())}));

function bindBook(){
  const f=$("bookForm"); if(!f)return;
  f.addEventListener("submit",e=>{
    e.preventDefault();
    const name=$("bName").value.trim(),phone=$("bPhone").value.replace(/\s/g,""),err=$("bErr");
    if(!name){err.textContent="اكتب اسمك عشان نعرف نرد عليك.";err.hidden=false;$("bName").focus();return}
    if(!/^01[0125]\d{8}$/.test(phone)){err.textContent="رقم الموبايل لازم يكون 11 رقم ويبدأ بـ 010 أو 011 أو 012 أو 015.";err.hidden=false;$("bPhone").focus();return}
    err.hidden=true;
    const note=$("bNote").value.trim();
    const msg=["السلام عليكم، عايز أحجز معاينة:",`الاسم: ${name}`,`الموبايل: ${phone}`,`المنطقة: ${$("bArea").value}`,`نوع المكان: ${$("bPlace").value}`,`الخدمة: ${$("bSvc").value}`].concat(note?[`تفاصيل: ${note}`]:[]).join("\n");
    const a=document.createElement("a");a.href=wa(msg);a.target="_blank";a.rel="noopener";document.body.appendChild(a);a.click();a.remove();
  });
}
window.addEventListener("hashchange",route);
route(); renderCart();
</script>
</body>
</html>
